<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uptime Command Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0a0f0f;
      color: #c8f7dc;
      font-family: "Courier New", monospace;
    }

    .crt {
      position: relative;
    }

    .crt::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 0, 0.03),
        rgba(0, 255, 0, 0.03) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    .lamp {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 10px;
      box-shadow: 0 0 8px currentColor;
    }
  </style>
</head>

<body class="min-h-screen crt">

  <div class="max-w-3xl mx-auto py-12 px-6">
    <h1 class="text-4xl font-bold mb-6 text-center tracking-widest">
      SYSTEM STATUS
