<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uptime Command Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0a0f0f;
      color: #c8f7dc;
      font-family: "Courier New", monospace;
    }

    .crt {
      position: relative;
    }

    .crt::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 0, 0.03),
        rgba(0, 255, 0, 0.03) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    .lamp {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 10px;
      box-shadow: 0 0 8px currentColor;
    }

    /* Reddit panel styling */
    .reddit-panel {
      background: rgba(0, 20, 40, 0.7);
      border: 2px solid #0ff;
      padding: 15px;
      margin: 20px 0;
      font-family: "Courier New", monospace;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
    }

    .reddit-panel ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .reddit-panel li {
      margin: 6px 0;
      padding: 4px 0;
      border-bottom: 1px solid rgba(0,255,255,0.2);
    }
  </style>
</head>

<body class="min-h-screen crt">

  <div class="max-w-3xl mx-auto py-12 px-6">
    <h1 class="text-4xl font-bold mb-6 text-center tracking-widest">
      SYSTEM STATUS
    </h1>

    <!-- ⭐ Reddit Trending Panel (correct placement) -->
    <div class="panel reddit-panel">
      <h2>COMMUNICATIONS ARRAY — REDDIT TRENDS</h2>
      <ul id="reddit-trending"></ul>
    </div>

  </div>

  <!-- ⭐ Reddit JavaScript (must be at bottom of body) -->
  <script>
    async function loadRedditTrending() {
      try {
        const response = await fetch("https://www.reddit.com/r/all/top.json?limit=10");
        const data = await response.json();

        const list = document.getElementById("reddit-trending");
        list.innerHTML = "";

        data.data.children.forEach(post => {
          const title = post.data.title;
          const subreddit = post.data.subreddit;
          const ups = post.data.ups;

          const li = document.createElement("li");
          li.textContent = `r/${subreddit} — ${title} (${ups}↑)`;
          list.appendChild(li);
        });
      } catch (err) {
        console.error("Reddit fetch failed:", err);
      }
    }

    loadRedditTrending();
    setInterval(loadRedditTrending, 60000);
  </script>

</body>
</html>
